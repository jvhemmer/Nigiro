name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        type: string
        required: true

jobs:
  bundle:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage
          - os: windows-latest
            bundles: nsis
          - os: macos-15
            bundles: app,dmg
          - os: macos-15-intel
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: "3.12"
      NIGIRO_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.NIGIRO_RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
      - name: Configure signed updates
        shell: bash
        env:
          NIGIRO_UPDATER_PUBLIC_KEY: ${{ vars.NIGIRO_UPDATER_PUBLIC_KEY }}
        run: |
          uv run --no-project python - <<'PY'
          import json
          import os
          from pathlib import Path

          directory = Path("src-tauri")
          version = json.loads((directory / "tauri.conf.json").read_text(encoding="utf-8"))["version"]
          if os.environ["NIGIRO_RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Tag does not match the app version v{version}.")
          public_key = os.environ["NIGIRO_UPDATER_PUBLIC_KEY"].strip()
          if not public_key:
              raise SystemExit("Set the NIGIRO_UPDATER_PUBLIC_KEY repository variable.")
          repository = os.environ["GITHUB_REPOSITORY"]
          config = {
              "bundle": {"createUpdaterArtifacts": True},
              "plugins": {"updater": {
                  "pubkey": public_key,
                  "requireSignedVersion": True,
                  "endpoints": [f"https://github.com/{repository}/releases/latest/download/latest.json"],
              }},
          }
          if os.environ["RUNNER_OS"] == "macOS":
              # The frozen engine loads separately signed Python libraries.
              config["bundle"]["macOS"] = {
                  "signingIdentity": "-",
                  "entitlements": str((directory / "macos-ad-hoc.entitlements.plist").resolve()),
              }
          (directory / "tauri.release.generated.json").write_text(json.dumps(config), encoding="utf-8")
          PY
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.NIGIRO_RELEASE_TAG }}
          releaseName: Nigiro ${{ env.NIGIRO_RELEASE_TAG }}
          releaseDraft: true
          generateReleaseNotes: true
          uploadUpdaterJson: true
          tauriScript: npx --no-install tauri
          args: --config src-tauri/tauri.release.generated.json --bundles ${{ matrix.bundles }} -- --locked
      - name: Run the engine from the signed app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          uv run --no-project python - <<'PY'
          import json
          import plistlib
          import subprocess
          from pathlib import Path

          engine = Path("src-tauri/target/release/bundle/macos/Nigiro.app/Contents/MacOS/nigiro-engine").resolve()
          entitlements = plistlib.loads(subprocess.check_output(["codesign", "-d", "--entitlements", "-", "--xml", str(engine)]))
          if not entitlements.get("com.apple.security.cs.disable-library-validation"):
              raise SystemExit("The signed engine needs permission to load its bundled Python libraries.")
          request = json.dumps({"action": "state", "_paged": True})
          response = subprocess.run([str(engine)], input=request + "\n", text=True,
                                    stdout=subprocess.PIPE, timeout=120, check=True)
          if "project" not in json.loads(response.stdout).get("state", {}):
              raise SystemExit("The bundled analysis engine did not return a project.")
          PY
