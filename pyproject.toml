[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nigiro"
version = "0.1.1"
description = "Reproducible scientific analysis and plotting for the desktop"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = [
    "impydance==0.1.0",
    "matplotlib>=3.6",
    "numpy>=1.24",
    "packaging",
    "scipy>=1.10",
    "typst==0.15.2",
]

[project.optional-dependencies]
qt = ["PyQt6>=6.5"]

[dependency-groups]
desktop = ["pyinstaller>=6.20"]

[tool.setuptools.package-data]
nigiro = ["fonts/*.ttf", "fonts/*.txt"]

[project.gui-scripts]
nigiro = "nigiro.ui:main"
